name: CI ntfy Notification

on:
  push:
    branches: [ "main" ]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Hello World script
        run: python main.py

      - name: Send ntfy notification
        run: |
          curl -d "Integración continua con éxito en main. Hola Mundo completado." ntfy.sh/devops-itla